[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fehm"
version = "1.4.0"
description = "Local-first codebase intelligence and architecture drift checks for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["nodejs-wheel-binaries==24.19.0"]

[project.urls]
Repository = "https://github.com/amirhamzakhan2001/fehm"
Documentation = "https://github.com/amirhamzakhan2001/fehm/blob/main/docs/DEPLOYMENT.md"

[project.scripts]
fehm = "fehm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/fehm"]

[tool.hatch.build.targets.wheel.force-include]
"build/fehm-runtime" = "fehm/runtime"

[tool.hatch.build.targets.sdist]
include = ["python/fehm", "pyproject.toml", "hatch_build.py", "README.md", "LICENSE"]

[tool.hatch.build.targets.sdist.force-include]
"build/fehm-runtime" = "build/fehm-runtime"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
