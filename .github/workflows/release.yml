name: Qualify FEHM artifacts
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'test/**', 'python/**', 'scripts/**', 'integrations/**', 'package*.json', 'pyproject.toml', 'hatch_build.py', 'website/**', 'docs/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run release:check
      - run: python scripts/artifact-check.py
      - uses: actions/upload-artifact@v4
        with:
          name: fehm-${{ runner.os }}-${{ runner.arch }}
          path: |
            python-dist/*.whl
            python-dist/*.tar.gz
            python-dist/SHA256SUMS
            python-dist/artifact-report.json
# Qualification only. No push, deployment, GitHub release, or registry publication step.
# See docs/DEPLOYMENT.md for the separate maintainer authorization gates.
